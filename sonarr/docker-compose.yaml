services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/user/appdata/sonarr:/config
      - /mnt/user/plexmedia/shows/:/tv
      - /mnt/user/downloads/completed:/downloads #optional
    ports:
      - 8989:8989
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.entrypoint=websecure"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.service.downindrakes.com`)"
      - "traefik.http.routers.sonarr.tls.certresolver=le"
      - "traefik.port=8096"
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    name: frontend
    external: true
